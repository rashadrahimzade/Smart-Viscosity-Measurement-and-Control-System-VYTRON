name: Arduino CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino-cli/setup-arduino-cli@v1

      - name: Update Arduino CLI core index
        run: arduino-cli core update-index

      - name: Install Arduino AVR core (for Mega 2560 and Nano)
        run: arduino-cli core install arduino:avr

      - name: Install required libraries
        run: |
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "AccelStepper"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "Keypad"

      - name: Compile Mega_IDE.ino (Arduino Mega 2560)
        run: arduino-cli compile --fqbn arduino:avr:mega Software/Mega_IDE.ino

      - name: Compile Nano_IDE.ino (Arduino Nano)
        run: arduino-cli compile --fqbn arduino:avr:nano Software/Nano_IDE.ino